<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #ffffff;
      }
      #circle {
        position: absolute;
        top: 810px;
        left: 0;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: #000000;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-5wif"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <div data-hf-id="hf-61ev" id="circle" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#circle", { x: 60 }, { x: 720, duration: 3, ease: "power1.inOut" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
